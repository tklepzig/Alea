name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Offline guarantees: static manifest cross-check, then a real browser
      # boot with the server killed — nothing may hit the network.
      - run: npm run verify:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:offline

      - run: rm -rf node_modules # only needed for the build, not in the deployed artifact
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
